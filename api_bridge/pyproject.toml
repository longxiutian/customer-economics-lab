[project]
name = "unc-sol-bridge"
version = "0.1.0"
description = "Budget-guarded stdio MCP bridge from one host chat to UNC gpt-6.1-sol for the Studio North lab."
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==2.3.0", "httpx==0.28.1"]

[project.optional-dependencies]
keyring = ["keyring>=25,<26"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
unc-sol-bridge = "unc_sol_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unc_sol_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
